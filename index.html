<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reminisce - Study Set Generator</title>
    <style>
        body { font-family: sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; }
        textarea { width: 100%; height: 120px; margin-bottom: 10px; }
        button { padding: 10px 20px; cursor: pointer; }
        .card { border: 1px solid #ccc; padding: 15px; margin-top: 15px; border-radius: 6px; }
        .error { color: #d9534f; background: #fdf2f2; border: 1px solid #f5c6cb; padding: 10px; border-radius: 6px; margin-top: 15px; }
    </style>
</head>
<body>
    <h1>Reminisce Study Generator</h1>
    <textarea id="notesInput" placeholder="Paste your study notes here..."></textarea><br>
    <button onclick="generateQuiz()">Generate Quiz</button>

    <div id="results"></div>

    <script>
        async function generateQuiz() {
            const notesInput = document.getElementById('notesInput');
            const resultsDiv = document.getElementById('results');

            if (!notesInput || !resultsDiv) {
                console.error("HTML elements missing!");
                return;
            }

            const notes = notesInput.value.trim();
            if (!notes) {
                resultsDiv.innerHTML = "<div class='error'>Please enter some notes first.</div>";
                return;
            }

            resultsDiv.innerHTML = "<p>Generating study set with Gemini...</p>";

            try {
                const response = await fetch('http://127.0.0.1:8000/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ notes: notes })
                });

                const data = await response.json();
                console.log("Backend Response:", data); // View in F12 Console

                if (!response.ok) {
                    throw new Error(data.detail || `Server returned status ${response.status}`);
                }

                if (!data.questions || !Array.isArray(data.questions)) {
                    throw new Error("Response structure invalid: missing 'questions' list.");
                }

                resultsDiv.innerHTML = "";

                data.questions.forEach((item, index) => {
                    resultsDiv.innerHTML += `
                        <div class="card">
                            <h3>Prompt ${index + 1}</h3>
                            <p><strong>Q:</strong> ${item.question}</p>
                            <p><strong>Ideal Answer:</strong> ${item.ideal_answer}</p>
                            <p><strong>Key Concepts:</strong> ${item.key_concepts.join(', ')}</p>
                        </div>
                    `;
                });

            } catch (err) {
                console.error("Error generated:", err);
                resultsDiv.innerHTML = `<div class='error'><strong>Error:</strong> ${err.message}</div>`;
            }
        }
    </script>
</body>
</html>
